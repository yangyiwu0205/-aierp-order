<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>AIERP 抄貨</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1d2330;--sub:#6b7280;--line:#e5e7eb;--pri:#0f766e;--good:#15803d;--mid:#c2410c;--bad:#b91c1c;--chip:#e6f4f1;--hl:#fff7e6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 14px;background:var(--chip);color:var(--ink)}
button.pri{background:var(--pri);color:#fff}
button.ghost{background:transparent;color:var(--pri);padding:6px 8px}
button.danger{background:#fee2e2;color:var(--bad)}
input,textarea,select{font:inherit;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;color:var(--ink);width:100%}
.hide{display:none!important}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:10px 12px 8px}
.top{display:flex;align-items:center;gap:6px}
.top h1{font-size:17px;margin:0;white-space:nowrap}
.top .sp{flex:1}
.top button.ghost{padding:6px 4px;font-size:14px}
.net{font-size:12px;padding:3px 8px;border-radius:12px;white-space:nowrap}
.net.on{background:#dcfce7;color:#166534}.net.off{background:#fee2e2;color:#991b1b}
.crow{display:flex;gap:6px;margin-top:8px}
.cust{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:10px;padding:8px 10px;font-size:14px}
.cust b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cust.none b{color:var(--sub);font-weight:400}
.crow input[type=date]{width:136px;flex:0 0 auto;padding:7px 8px;font-size:14px}
.crow select{flex:0 0 auto;width:auto;max-width:96px;padding:7px 6px;font-size:14px}
.tools{display:flex;gap:6px;margin-top:6px}
.tools input[type=search]{flex:1;min-width:0;width:auto;font-size:16px}
.scan{flex:0 0 auto;background:var(--pri);color:#fff;font-size:15px;padding:9px 12px}
.chips{display:flex;gap:6px;margin-top:6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;padding:6px 12px;border-radius:20px;background:#f1f3f6;font-size:13px}
.chips button.on{background:var(--pri);color:#fff}
.meta{font-size:12px;color:var(--sub);padding:6px 12px}
.list{padding:0 10px 110px}
.item{background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.item.inq{outline:2px solid #86efac}
.nm{font-weight:600}
.code{font-size:12px;color:var(--sub);word-break:break-all}
.nums{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:13px;margin-top:4px}
.nums b{font-weight:600}
.neg{color:var(--bad)}
.dates{font-size:12px;color:var(--sub);margin-top:2px}
.last{background:var(--hl);border-radius:8px;padding:5px 8px;font-size:13px;margin-top:6px;color:#7c4a03}
.mg{font-weight:700}
.mg.g{color:var(--good)}.mg.m{color:var(--mid)}.mg.b{color:var(--bad)}
.qrow{display:flex;gap:6px;align-items:center;margin-top:8px}
.qrow label{font-size:12px;color:var(--sub);white-space:nowrap}
.qrow input{padding:7px 8px;font-size:16px;font-weight:600;border-color:#99d5cb;background:#f6fbfa;min-width:0}
.qrow .n{flex:1}.qrow .p{flex:1.2}
.qrow .add{flex:0 0 auto;padding:8px 12px;background:var(--pri);color:#fff;font-weight:600}
.qrow .add.in{background:var(--good)}
.cline{font-size:12px;margin-top:4px;color:var(--sub)}
.more{display:block;margin:6px auto 20px}
.cart{position:fixed;left:10px;right:10px;bottom:10px;z-index:6;display:flex;align-items:center;gap:10px;background:#111827;color:#fff;border-radius:14px;padding:10px 14px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.cart .t{flex:1;font-size:14px;min-width:0}
.cart button{background:#fff;color:#111827;font-weight:600}
body.typing .cart{display:none!important}
.sheet{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.4);display:flex;align-items:flex-end}
.panel{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 14px 24px}
.sheet{top:var(--vvt,0px);height:var(--vvh,100%);bottom:auto}
.panel{max-height:calc(var(--vvh,100vh) - 16px)}
.panel h2{font-size:17px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.panel h2 span{flex:1}
.kv{display:grid;grid-template-columns:88px 1fr;gap:6px 10px;margin:10px 0;font-size:14px}
.kv div:nth-child(odd){color:var(--sub)}
.qi{border-bottom:1px solid var(--line);padding:10px 0}
.sum{background:#f8fafc;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.sum div{display:flex;justify-content:space-between}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.row button{flex:1}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#111827;color:#fff;padding:9px 16px;border-radius:20px;z-index:30;font-size:14px;max-width:90vw}
.center{text-align:center;padding:40px 20px;color:var(--sub)}
.login{max-width:320px;margin:18vh auto;padding:20px;text-align:center}
.login input{text-align:center;font-size:22px;letter-spacing:6px;margin:14px 0}
.clist .c{padding:10px 4px;border-bottom:1px solid var(--line)}
.clist .c b{display:block}
.day{font-weight:700;margin:14px 0 6px;color:var(--sub);font-size:14px}
.ord{background:#f8fafc;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.ord.cur{outline:2px solid var(--pri)}
.badge{font-size:11px;padding:2px 7px;border-radius:10px;white-space:nowrap}
.badge.wait{background:#fef3c7;color:#92400e}.badge.ok{background:#dcfce7;color:#166534}
#vid{width:100%;max-height:55vh;background:#000;border-radius:10px;object-fit:cover}
.aim{position:relative}
.aim:after{content:"";position:absolute;left:10%;right:10%;top:50%;height:2px;background:#ef4444;box-shadow:0 0 6px #ef4444}
.ccard{background:#fff;padding:18px 16px}
.ccard h3{margin:0;font-size:20px;text-align:center}
.ccard .d{text-align:center;color:var(--sub);font-size:13px;margin:4px 0 12px}
.ci{display:flex;gap:10px;border-bottom:1px solid var(--line);padding:8px 0}
.ci .r{text-align:right;font-size:14px;white-space:nowrap}
.ctot{text-align:right;font-size:18px;font-weight:700;margin-top:12px}
.nocost .cst{display:none!important}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AIERP抄貨">
</head>
<body class="nocost">

<div id="login" class="login hide">
  <h2>AIERP 抄貨</h2>
  <div style="color:var(--sub)">請輸入名字和密碼（登入會記錄手機與 IP）</div>
  <input id="who" placeholder="你的名字" style="margin-top:14px;font-size:17px">
  <input id="pin" type="tel" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="密碼">
  <button class="pri" style="width:100%" onclick="doLogin()">進入</button>
  <div id="loginErr" style="color:var(--bad);margin-top:10px"></div>
</div>

<div id="app" class="hide">
  <header>
    <div class="top">
      <h1>AIERP 抄貨</h1>
      <span class="net on" id="net" onclick="syncNow(true)">● 線上</span>
      <span class="sp"></span>
      <button class="ghost" id="costBtn" onclick="toggleCost()">顯示成本</button>
      <button class="ghost" onclick="openOrders()">抄貨紀錄</button>
    </div>
    <div class="crow">
      <div class="cust none" id="custBar" onclick="pickCust()"><span>客戶</span><b id="custName">點這裡選客戶</b><span>▾</span></div>
      <select id="coSel" class="hide" onchange="setCo(this.value)"></select>
      <input type="date" id="day" onchange="setDay(this.value)">
    </div>
    <div class="tools">
      <input id="q" type="search" placeholder="品名／貨號／條碼（掃描槍也可以）" oninput="onSearch()" onkeydown="if(event.key==='Enter'){event.preventDefault();enterSearch()}">
      <button class="scan" onclick="openScan()">📷 掃條碼</button>
    </div>
    <div class="chips" id="chips"></div>
  </header>
  <div class="meta" id="meta">讀取中…</div>
  <div class="list" id="list"></div>
  <div class="cart hide" id="cart" onclick="openOrder()">
    <div class="t" id="cartT"></div>
    <button>看抄貨單</button>
  </div>
</div>

<input type="file" id="photoIn" accept="image/*" capture="environment" style="display:none" onchange="photoPicked(this)">
<div id="sheet" class="sheet hide" onclick="if(event.target===this){if(document.body.classList.contains('typing'))document.activeElement.blur();else closeSheet();}"><div class="panel" id="panel"></div></div>

<script>
/* ============================================================================
 * AIERP 抄貨（現場抄貨／報價）
 * - 抄貨單＝一個客戶＋一天，全部先存在這支手機，有網路才上傳（沒網路照常抄）
 * - 品項、庫存、客戶叫貨紀錄存在手機（IndexedDB），沒網路也能搜尋、掃條碼
 * - 成本只放記憶體，按「顯示成本」才跟雲端拿，不存手機
 * - 在 Google 頁面裡用 google.script.run；單獨開這個檔（離線版）就用 fetch 叫同一個 API
 * ========================================================================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbxbcwAR4-lWp-8ybzAAev1yzBTmz-6ITqWSoGP5blVMvHoOCl5OUgPzF6Aaq03b651E/exec';
const GAS = !!(window.google && google.script && google.script.run);
// 網站版（可即時掃條碼、離線打開）。網址用拼的，避開 Google 砍「//」的問題
const SITE_URL = ['https:', '', 'yangyiwu0205.github.io', '-aierp-order', ''].join('/');
const IN_LINE = /\bLine\//i.test(navigator.userAgent);
// LINE 內建瀏覽器不給相機：網站版在 LINE 裡打開就自動改用手機的 Chrome／Safari 開
if (!GAS && IN_LINE && !/openExternalBrowser/.test(location.search)) location.replace(location.pathname + '?openExternalBrowser=1');

const LS = { get(k, d) { try { const v = localStorage.getItem('eq_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
             set(k, v) { try { localStorage.setItem('eq_' + k, JSON.stringify(v)); } catch (e) { toast('手機儲存空間不足！'); } } };
const LSQ = k => { try { return JSON.parse(localStorage.getItem('sq_' + k)); } catch (e) { return null; } };
let PIN = LS.get('pin', '') || LSQ('pin') || '';
let WHO = LS.get('who', null) || LSQ('who') || {};
if (!WHO.id) WHO.id = 'D' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2, 6).toUpperCase();
LS.set('who', WHO);

/* ---------------- 手機上的大資料：IndexedDB ---------------- */
const IDB = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((ok, bad) => {
      const r = indexedDB.open('aierp-quote', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => ok(this.db = r.result);
      r.onerror = () => bad(r.error);
    });
  },
  async get(k) { try { const db = await this.open(); return await new Promise(ok => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => ok(q.result); q.onerror = () => ok(undefined); }); } catch (e) { return undefined; } },
  async set(k, v) { try { const db = await this.open(); await new Promise(ok => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = ok; t.onerror = ok; }); } catch (e) {} },
};

let SNAP = null, BYSKU = {}, BYBC = {}, HALL = {}, HIST = {}, COSTS = null, showCost = false;
let CUST = LS.get('cust', null);
let DAY = today(), MODE = 'recent', LIMIT = 60, ONLINE = navigator.onLine;
let ORDERS = LS.get('orders', []);
/* 多公司：抄貨單開在哪家公司。預設主公司（景麒），要開在別家就用客戶列旁邊的選單改。
 * 雲端資料裡有兩家以上公司才會出現選單；舊的單子沒有公司，一律當主公司。 */
let CO = '';
const COMPANIES = () => (SNAP && SNAP.companies) || [];
const MULTI = () => COMPANIES().length > 1;
const PRIMARY = () => { const c = COMPANIES().find(x => x.p); return c ? c.k : ''; };
const coOf = o => o.co || PRIMARY();
const coName = k => { const c = COMPANIES().find(x => x.k === (k || PRIMARY())); return c ? c.n : ''; };
function drawCo() {
  const el = document.getElementById('coSel'); if (!el) return;
  const cs = COMPANIES();
  el.classList.toggle('hide', cs.length < 2);
  if (cs.length < 2) return;
  el.innerHTML = cs.map(c => `<option value="${esc(c.k)}">${esc(c.n)}</option>`).join('');
  el.value = CO;
}
function setCo(k) { CO = k; render(); updateCart(); toast('開單公司：' + coName(k)); }
/* 換客戶、換日期：回到預設的主公司；這個客戶這天已經有開在別家的單，就跟著那張 */
function syncCo() {
  const p = PRIMARY();
  const mine = CUST ? ORDERS.filter(x => !x.del && x.cust.k === CUST.k && x.date === DAY && x.sales === WHO.name) : [];
  CO = !mine.length ? p : mine.some(x => coOf(x) === p) ? p : coOf(mine[0]);
  drawCo();
}

function today() { return new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10); }
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = v => v == null || v === '' || isNaN(v) ? '—' : '$' + (Math.round(v * 100) / 100).toLocaleString('zh-TW');
const numTxt = v => v == null ? '—' : (Math.round(v * 100) / 100).toLocaleString('zh-TW');
const mgOf = (p, c) => p > 0 && c != null ? Math.round((p - c) / p * 1000) / 10 : null;
const mgCls = m => m == null ? '' : m >= 30 ? 'g' : m >= 15 ? 'm' : 'b';
const mgTxt = m => m == null ? '—' : m + '%';
const md = d => { if (!d) return ''; const p = d.split('-'); return Number(p[1]) + '/' + Number(p[2]); };
const ymd = d => d ? d.replace(/-/g, '/') : '';
const ago = d => { if (!d) return ''; const n = Math.round((new Date(today()) - new Date(d)) / 864e5); return n <= 0 ? '今天' : n + ' 天前'; };
const WEEK = '日一二三四五六';
const dayTxt = d => { const t = new Date(d + 'T00:00:00'); return `${t.getMonth() + 1}/${t.getDate()}（${WEEK[t.getDay()]}）${d === today() ? '今天' : ''}`; };

function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2200); }

/* ---------------- 叫雲端 ---------------- */
const isNetErr = e => !navigator.onLine || /network|http 0|failed to fetch|load failed|連線|timeout/i.test(String(e && (e.message || e)));
function call(action, arg) {
  const done = (r, ok, bad) => {
    setNet(true);
    if (r && r.err === 'PIN') { LS.set('pin', ''); PIN = ''; showLogin('密碼不對'); return bad(new Error('密碼不對')); }
    if (!r || !r.ok) return bad(new Error(r && (r.msg || r.err) || '雲端沒有回應'));
    ok(r);
  };
  const fail = (e, bad) => { const err = new Error(String(e && (e.message || e))); err.net = isNetErr(e); if (err.net) setNet(false); bad(err); };
  if (GAS) return new Promise((ok, bad) => google.script.run.withSuccessHandler(r => done(r, ok, bad)).withFailureHandler(e => fail(e, bad)).erpCall(PIN, action, arg || {}));
  return new Promise((ok, bad) => {
    fetch(API_URL, { method: 'POST', body: JSON.stringify({ page: 'erp', pin: PIN, api: action, arg: arg || {} }) })
      .then(r => r.json()).then(r => done(r, ok, bad)).catch(e => fail(e, bad));
  });
}
function setNet(on) {
  ONLINE = on;
  const p = ORDERS.filter(o => o.dirty).length, el = document.getElementById('net');
  el.className = 'net ' + (on ? 'on' : 'off');
  el.textContent = (on ? '● 線上' : '● 離線') + (p ? `｜${p} 張待上傳` : '');
}

/* ---------------- 登入 ---------------- */
function showLogin(err) { document.getElementById('app').classList.add('hide'); document.getElementById('login').classList.remove('hide'); document.getElementById('loginErr').textContent = err || ''; document.getElementById('who').value = WHO.name || ''; }
async function doLogin() {
  PIN = document.getElementById('pin').value.trim();
  WHO.name = document.getElementById('who').value.trim();
  if (!WHO.name) return document.getElementById('loginErr').textContent = '請填名字';
  LS.set('who', WHO);
  try { await logIn(); LS.set('pin', PIN); await boot(); } catch (e) { document.getElementById('loginErr').textContent = e.net ? '沒有網路，第一次登入需要網路' : e.message; }
}
document.getElementById('pin').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
function deviceName() {
  const u = navigator.userAgent;
  const m = u.match(/\(Linux; Android [\d.]+; ([^;)]+)/) || u.match(/\((iPhone|iPad)[^)]*OS ([\d_]+)/);
  if (m) return m[2] ? m[1] + ' iOS ' + m[2].replace(/_/g, '.') : 'Android ' + m[1].replace(/ Build.*/, '');
  return /Windows/.test(u) ? 'Windows 電腦' : /Mac OS/.test(u) ? 'Mac 電腦' : '其他裝置';
}
async function getIP() { try { const r = await fetch('https://api.ipify.org?format=json'); return (await r.json()).ip || ''; } catch (e) { return ''; } }
async function logIn() { await call('login', { name: WHO.name, id: WHO.id, ip: await getIP(), dev: deviceName(), ua: navigator.userAgent }); }

/* 開機：手機有存資料就先用（沒網路也能用），再到背景跟雲端對資料 */
async function boot() {
  document.getElementById('login').classList.add('hide');
  document.getElementById('app').classList.remove('hide');
  document.getElementById('day').value = DAY;
  drawCust(); updateCart(); setNet(navigator.onLine);
  const cached = await IDB.get('snap');
  if (cached) { useSnap(cached); HALL = (await IDB.get('hist')) || {}; useCust(); syncCo(); render(); }
  else document.getElementById('list').innerHTML = '<div class="center">第一次使用，下載 AIERP 品項中（約 1MB）…</div>';
  try {
    await refreshData(!cached);
  } catch (e) {
    if (!cached) document.getElementById('list').innerHTML = `<div class="center">${e.net ? '沒有網路，第一次要先在有網路的地方打開一次' : esc(e.message)}<br><br><button onclick="location.reload()">再試一次</button></div>`;
    else if (!e.net) toast(e.message);
  }
  syncNow();
}
async function refreshData(force) {
  const v = (await call('ver')).data, have = LS.get('ver', {});
  if (force || v.snap !== have.snap || !SNAP) {
    const s = (await call('snap')).data; await IDB.set('snap', s); useSnap(s);
  }
  if (force || v.hist !== have.hist) { HALL = (await call('hist')).data || {}; await IDB.set('hist', HALL); }
  LS.set('ver', v);
  useCust(); softRender();
  pullOrders().catch(() => {});
}
function useSnap(s) {
  SNAP = s; BYSKU = {}; BYBC = {};
  s.items.forEach(it => {
    BYSKU[it.k] = it;
    String(it.b || '').split(/[\s,;／/]+/).filter(Boolean).forEach(b => { (BYBC[b.toUpperCase()] ||= []).push(it); });
  });
  if (!COMPANIES().some(c => c.k === CO)) CO = PRIMARY();
  drawCo();
}
function useCust() { HIST = CUST ? HALL[CUST.k] || {} : {}; if (CUST && MODE === 'recent' && Object.keys(HIST).length && !document.getElementById('q').value) MODE = 'cust'; }

/* ---------------- 抄貨單（本機） ---------------- */
function saveOrders() { LS.set('orders', ORDERS); updateCart(); setNet(ONLINE); }
function curOrder(create) {
  if (!CUST) return null;
  let o = ORDERS.find(x => !x.del && x.cust.k === CUST.k && x.date === DAY && x.sales === WHO.name && coOf(x) === CO);
  if (!o && create) {
    o = { id: 'O' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7), no: '', date: DAY, cust: { k: CUST.k, n: CUST.n }, sales: WHO.name, co: CO, note: '', items: [], upd: Date.now(), dirty: true };
    ORDERS.push(o);
  }
  return o;
}
function touch(o) { o.upd = Date.now(); o.dirty = true; saveOrders(); clearTimeout(touch.t); touch.t = setTimeout(syncNow, 4000); }

/* ---------------- 上傳／下載 ---------------- */
let SYNCING = false;
async function syncNow(manual) {
  if (SYNCING) return;
  const pend = ORDERS.filter(o => o.dirty);
  if (!pend.length) { if (manual) { toast('全部都已上傳'); pullOrders().catch(() => {}); } return; }
  SYNCING = true;
  try {
    const sent = pend.map(o => ({ id: o.id, date: o.date, cust: o.cust, sales: o.sales, note: o.note, items: o.items, upd: o.upd, del: !!o.del, fin: o.fin || 0, co: o.co || '' }));
    const r = (await call('syncOrders', { orders: sent, dev: deviceName() })).data;
    r.forEach(x => {
      const o = ORDERS.find(y => y.id === x.id); if (!o) return;
      o.no = x.no; if (x.fin) o.fin = x.fin;
      if (o.upd === x.upd) o.dirty = false;      // 上傳途中又改過的，下次再送
    });
    ORDERS = ORDERS.filter(o => !(o.del && !o.dirty));
    saveOrders();
    if (manual) toast(`已上傳 ${r.length} 張`);
  } catch (e) {
    if (manual) toast(e.net ? '還是沒有網路，有網路會自動上傳' : '上傳失敗：' + e.message);
  } finally { SYNCING = false; }
}
/* 其他手機（或別的業務）抄的單也拉下來看；手機上還沒上傳的不會被蓋掉 */
async function pullOrders() {
  const list = (await call('listOrders', { days: 45 })).data;
  list.forEach(c => {
    const i = ORDERS.findIndex(o => o.id === c.id);
    if (i < 0) { if (!c.del) ORDERS.push(Object.assign(c, { dirty: false })); return; }
    const o = ORDERS[i];
    if (o.dirty) return;
    if (c.del) ORDERS.splice(i, 1);
    else if (c.upd >= o.upd) ORDERS[i] = Object.assign(c, { dirty: false });
  });
  const cut = new Date(Date.now() - 60 * 864e5).toISOString().slice(0, 10);
  ORDERS = ORDERS.filter(o => o.dirty || o.date >= cut);
  saveOrders(); updateCart();
}

    const n = e && e.name, ios = /iPhone|iPad/.test(navigator.userAgent);
    msg.innerHTML = '<b style="color:var(--bad)">開不了即時相機</b><br>' + (
      !navigator.mediaDevices ? '這個瀏覽器不能開相機，請用' + (ios ? ' Safari ' : ' Chrome ') + '打開這個網址（不要在 LINE 裡開）'
      : n === 'NotAllowedError' ? '相機權限被拒絕了：' + (ios ? '到「設定 → Safari → 相機」改成「允許」，' : '按網址列左邊的圖示 → 權限 → 相機改成「允許」，') + '再重開這頁'
      : n === 'NotReadableError' ? '相機被別的 App 占用，先關掉其他用相機的 App 再試'
      : '原因：' + esc(n || e) ) + '<br>暫時可以先用下面的「拍照辨識」';
    return;
  }
  const v = document.getElementById('vid'); v.srcObject = STREAM; await v.play().catch(() => {});
  SCANNING = true;
  const cv = document.createElement('canvas'), ctx = cv.getContext('2d', { willReadFrequently: true });
  loadZXing().catch(() => {});
  const tick = async () => {
    if (!SCANNING) return;
    if (v.videoWidth) {
      const w = v.videoWidth, hh = Math.round(v.videoHeight * 0.4);
      cv.width = w; cv.height = hh;
      ctx.drawImage(v, 0, Math.round((v.videoHeight - hh) / 2), w, hh, 0, 0, w, hh);
      const code = await decodeCanvas(cv);
      if (code && SCANNING) { if (navigator.vibrate) navigator.vibrate(80); return gotCode(code); }
    }
    setTimeout(tick, 200);
  };
  tick();
}
function stopCam() { SCANNING = false; if (STREAM) { STREAM.getTracks().forEach(t => t.stop()); STREAM = null; } }
async function scanPhoto(inp) {
  const f = inp.files && inp.files[0]; if (!f) return;
  const msg = document.getElementById('scanMsg'); msg.textContent = '辨識中…';
  const img = new Image(); img.src = URL.createObjectURL(f); inp.value = "";
  await new Promise(r => { img.onload = r; img.onerror = r; });
  const cv = document.createElement('canvas'), ctx = cv.getContext('2d', { willReadFrequently: true });
  for (const max of [1600, 1000, 2400]) for (const rot of [0, 90]) {
    const s = Math.min(1, max / Math.max(img.width, img.height)), w = Math.round(img.width * s), h = Math.round(img.height * s);
    cv.width = rot ? h : w; cv.height = rot ? w : h;
    ctx.save(); if (rot) { ctx.translate(h, 0); ctx.rotate(Math.PI / 2); } ctx.drawImage(img, 0, 0, w, h); ctx.restore();
    const code = await decodeCanvas(cv);
    if (code) return gotCode(code);
  }
  msg.innerHTML = '<b style="color:var(--bad)">認不出來</b>，請再拍一次（拍近一點、條碼橫放、對焦清楚），或手動輸入';
  inp.value = '';
}
function gotCode(code) {
  code = String(code || '').trim(); if (!code) return;
  stopCam();
  if (!lookupCode(code)) { closeSheet(); document.getElementById('q').value = code; MODE = 'all'; render(); toast('AIERP 找不到條碼 ' + code); }
}

/* ---------------- 成本（要按才顯示，不存手機） ---------------- */
async function toggleCost() {
  if (!showCost && !COSTS) {
    toast('讀取成本…');
    try { COSTS = (await call('costs')).data; } catch (e) { return toast(e.net ? '沒有網路，看不到成本' : '讀不到成本：' + e.message); }
  }
  showCost = !showCost;
  document.body.classList.toggle('nocost', !showCost);
  document.getElementById('costBtn').textContent = showCost ? '隱藏成本' : '顯示成本';
  render(); updateCart();
  if (!document.getElementById('sheet').classList.contains('hide') && document.getElementById('qsum')) openOrder();
}

/* ---------------- 抄貨單畫面 ---------------- */
function totals(o) {
  let t = 0, c = 0, n = 0, cMissing = false;
  (o ? o.items : []).forEach(x => { const k = Number(x.n) || 0, p = Number(x.q) || 0, cc = COSTS && COSTS[x.code]; t += p * k; n += k; if (cc == null) cMissing = true; else c += cc * k; });
  return { total: t, qty: n, cost: c, profit: t - c, margin: t > 0 && COSTS ? Math.round((t - c) / t * 1000) / 10 : null, cMissing };
}
function updateCart() {
  const el = document.getElementById('cart'), o = curOrder();
  if (!o || !o.items.length) return el.classList.add('hide');
  const s = totals(o);
  el.classList.remove('hide');
  document.getElementById('cartT').innerHTML = `${MULTI() ? esc(coName(o.co)) + '｜' : ''}${esc(o.cust.n)}｜${md(o.date)} 抄 ${o.items.length} 項｜${money(s.total)}<span class="cst">｜毛利 ${mgTxt(s.margin)}</span><br><span style="font-size:12px;opacity:.8">${o.dirty ? '⏳ 存在手機，等上傳' : '✓ 已上傳 ' + esc(o.no)}</span>`;
}
function openOrder(id) {
  const o = id ? ORDERS.find(x => x.id === id) : curOrder();
  if (!o) return toast('這個客戶這天還沒抄貨');
  if (id) { CO = coOf(o); drawCo(); }
  if (id && (o.cust.k !== (CUST && CUST.k) || o.date !== DAY)) { CUST = o.cust; LS.set('cust', CUST); DAY = o.date; document.getElementById('day').value = DAY; drawCust(); useCust(); render(); }
  const s = totals(o), mine = o.sales === WHO.name;
  openSheet(`<h2><span>${esc(o.cust.n)}｜${dayTxt(o.date)}</span><button class="ghost" onclick="closeSheet()">關閉</button></h2>
    <div class="code">${o.no ? '單號 ' + esc(o.no) : '還沒有單號（上傳後產生）'}｜${esc(o.sales)}｜<span class="badge ${o.dirty ? 'wait' : 'ok'}">${o.dirty ? '存在手機，等上傳' : '已上傳'}</span>｜${o.fin ? '<span class="badge ok">已按完成，公司會收到 LINE</span>' : '<span class="badge wait">還沒按完成，公司不知道</span>'}</div>
    ${mine ? '' : '<div class="last">這張是 ' + esc(o.sales) + ' 抄的，只能看</div>'}
    ${MULTI() ? `<div style="display:flex;align-items:center;gap:8px;margin-top:8px"><label style="white-space:nowrap">開單公司</label>
      <select ${mine ? '' : 'disabled'} onchange="setOrderCo(this.value)">${COMPANIES().map(c => `<option value="${esc(c.k)}" ${coOf(o) === c.k ? 'selected' : ''}>${esc(c.n)}</option>`).join('')}</select></div>` : ''}
    <textarea rows="2" style="margin-top:8px" placeholder="備註（交期、運費…）" ${mine ? '' : 'disabled'} oninput="ORD.note=this.value;touch(ORD)">${esc(o.note)}</textarea>
    <div>${o.items.map((x, i) => {
      const c = COSTS && COSTS[x.code], m = mgOf(Number(x.q), c), it = BYSKU[x.code];
      return `<div class="qi">
        <div class="nm" style="font-size:14px">${esc(x.name)}</div>
        <div class="code">${esc(x.code)}${it ? '｜庫存 ' + numTxt(it.oh) + ' ' + esc(it.u) : ''}<span class="cst">｜成本 ${money(c)}</span></div>
        <div class="qrow">
          <label>數量</label><input class="n" type="number" inputmode="decimal" value="${esc(x.n)}" ${mine ? '' : 'disabled'} oninput="setQ(${i},'n',this.value)">
          <label>單價</label><input class="p" type="number" inputmode="decimal" value="${esc(x.q)}" ${mine ? '' : 'disabled'} oninput="setQ(${i},'q',this.value)">
          ${mine ? `<button class="ghost" style="color:var(--bad)" onclick="delQ(${i})">刪</button>` : ''}
        </div>
        <div style="font-size:13px;margin-top:4px">小計 <b id="st${i}">${money((Number(x.q) || 0) * (Number(x.n) || 0))}</b>
          <span class="cst">｜毛利 <span id="qm${i}" class="mg ${mgCls(m)}">${mgTxt(m)}</span></span></div>
      </div>`;
    }).join('') || '<div class="center">還沒有品項</div>'}</div>
    <div class="sum" id="qsum">${sumHtml(s)}</div>
    <div class="row"><button class="pri" onclick="finishOrder()">${o.fin ? '完成並上傳（改過會再通知）' : '完成並上傳（通知公司）'}</button><button onclick="custView()">客戶版</button></div>
    <div class="row"><button onclick="copyText()">複製文字（貼 LINE）</button>${mine ? '<button class="danger" onclick="delOrder()">刪除這張單</button>' : ''}</div>
    <div class="row"><button onclick="excel('cust')">Excel（客戶版）</button><button class="cst" onclick="excel('inner')">Excel（內部含毛利）</button></div>`);
  window.ORD = o;
}
/* 按「完成並上傳」＝這張單抄好了，AIERP 主機會用公司 LINE 發到「優之館業務訂單」群 */
function finishOrder() {
  const o = ORD;
  if (!o.items.length) return toast('這張單沒有品項');
  const dup = o.items.map(x => shippedRecently(x.code)).filter(Boolean);
  if (dup.length && !confirm(`⚠ 這些品項這客戶 3 天內 AIERP 已經出過貨：
${dup.join(String.fromCharCode(10))}

確定沒有重複，要送出嗎？`)) return;
  o.fin = o.fin || Date.now(); touch(o);
  closeSheet(); syncNow(true);
  toast('已完成，公司會收到 LINE 通知' + (ONLINE ? '' : '（現在沒網路，有網路才會送出）'));
}
/* AIERP 銷貨紀錄裡這客戶 3 天內出過這個品項 → 回一行說明，沒有回空字串 */
function shippedRecently(sku) {
  const h = HIST[sku]; if (!h || !h[0]) return '';
  const d = Math.round((new Date(today()) - new Date(h[0])) / 864e5);
  if (d > 3) return '';
  const it = BYSKU[sku];
  return `${it ? it.n : sku}：${md(h[0])} 已出 ${numTxt(h[1])} ${it ? it.u : ''}`;
}
/* 改這張單開在哪家公司。同一個客戶同一天在那家已經有單就不能改（會變成兩張一樣的） */
function setOrderCo(k) {
  const o = ORD;
  if (ORDERS.some(x => x !== o && !x.del && x.cust.k === o.cust.k && x.date === o.date && x.sales === o.sales && coOf(x) === k)) {
    toast('這個客戶這天在「' + coName(k) + '」已經有一張單了'); return openOrder(o.id);
  }
  o.co = k; touch(o); CO = k; drawCo(); render(); updateCart(); openOrder(o.id);
}
function sumHtml(s) {
  return `<div><span>數量合計</span><span>${numTxt(s.qty)}</span></div><div><span>金額</span><b>${money(s.total)}</b></div>
    <div class="cst"><span>成本總額</span><span>${money(s.cost)}${s.cMissing ? '（有品項沒成本）' : ''}</span></div>
    <div class="cst"><span>毛利</span><b>${money(s.profit)}｜<span class="mg ${mgCls(s.margin)}">${mgTxt(s.margin)}</span></b></div>`;
}
function setQ(i, k, v) {
  const o = ORD, x = o.items[i]; x[k] = v; touch(o);
  document.getElementById('st' + i).textContent = money((Number(x.q) || 0) * (Number(x.n) || 0));
  const m = mgOf(Number(x.q), COSTS && COSTS[x.code]), el = document.getElementById('qm' + i);
  el.textContent = mgTxt(m); el.className = 'mg ' + mgCls(m);
  document.getElementById('qsum').innerHTML = sumHtml(totals(o));
}
function delQ(i) { ORD.items.splice(i, 1); touch(ORD); render(); openOrder(ORD.id); }
function delOrder() {
  if (!confirm(`刪除 ${ORD.cust.n} ${md(ORD.date)} 這張抄貨單？`)) return;
  ORD.del = true; ORD.items = []; touch(ORD); closeSheet(); render(); toast('已刪除');
}
function orderText(o) {
  const s = totals(o);
  const lines = [`【訂貨單】${o.cust.n}　${ymd(o.date)}`];
  if (MULTI()) lines.push('開單公司：' + coName(o.co));
  o.items.forEach((x, i) => lines.push(`${i + 1}. ${x.name}\n   ${x.n}${x.unit ? ' ' + x.unit : ''}${x.q !== '' && x.q != null ? ' × ' + money(Number(x.q)) + ' = ' + money((Number(x.q) || 0) * (Number(x.n) || 0)) : ''}`));
  lines.push(`合計：${money(s.total)}`);
  if (o.note) lines.push('備註：' + o.note);
  return lines.join('\n');
}
function copyText() {
  const t = orderText(ORD);
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('已複製，可貼到 LINE'))
    .catch(() => openSheet(`<h2><span>長按全選複製</span><button class="ghost" onclick="openOrder(ORD.id)">返回</button></h2><textarea rows="14">${esc(t)}</textarea>`));
}
function custView() {
  const o = ORD, s = totals(o);
  openSheet(`<div class="ccard"><h3>訂貨單</h3>
    <div class="d">${MULTI() ? esc(coName(o.co)) + '　' : ''}${esc(o.cust.n)}　${ymd(o.date)}${o.no ? '　' + esc(o.no) : ''}</div>
    ${o.items.map(x => `<div class="ci"><div style="flex:1"><div style="font-weight:600">${esc(x.name)}</div><div class="code">${esc(x.code)}</div></div>
      <div class="r">${money(Number(x.q))} × ${esc(x.n)}${x.unit ? ' ' + esc(x.unit) : ''}<br><b>${money((Number(x.q) || 0) * (Number(x.n) || 0))}</b></div></div>`).join('')}
    <div class="ctot">合計 ${money(s.total)}</div>
    ${o.note ? `<div style="white-space:pre-wrap;margin-top:10px;font-size:14px">備註：${esc(o.note)}</div>` : ''}
    <div style="text-align:center;color:var(--sub);font-size:12px;margin-top:16px">（這頁不含成本，可直接截圖給客戶）</div>
    <div class="row"><button onclick="openOrder(ORD.id)">返回</button></div></div>`);
}
async function excel(mode) {
  const o = ORD; if (!o.items.length) return toast('這張單沒有品項');
  toast('產生 Excel 中，約 10 秒…');
  try {
    const quote = { id: o.no, customer: o.cust.n, note: o.note, items: o.items.map(x => ({ tab: 'erp', code: x.code, name: x.name, q: x.q, n: x.n })) };
    const r = await call('excel', { quote, mode, who: { name: o.sales } });
    const bin = atob(r.data.b64), arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    const blob = new Blob([arr], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const file = new File([blob], r.data.name.replace('報價單', '訂貨單'), { type: blob.type });
    // 做好後在頁面上放「下載」按鈕（手機上點了才算本人操作，下載／分享才不會被擋）
    XLS = { file, url: URL.createObjectURL(blob), back: o.id };
    const share = navigator.canShare && navigator.canShare({ files: [file] });
    openSheet(`<h2><span>Excel 做好了</span><button class="ghost" onclick="closeSheet()">關閉</button></h2>
      <div class="code" style="margin:6px 0 12px;word-break:break-all">📄 ${esc(file.name)}（${Math.max(1, Math.round(blob.size / 1024))} KB）</div>
      <a href="${XLS.url}" download="${esc(file.name)}" onclick="setTimeout(()=>toast('已下載，在手機的「下載」資料夾'),300)"
        style="display:block;text-align:center;background:var(--pri);color:#fff;border-radius:10px;padding:14px;font-size:17px;text-decoration:none">⬇ 下載 Excel</a>
      ${share ? '<button style="width:100%;margin-top:8px;padding:13px;font-size:16px" onclick="shareXls()">📤 分享（傳 LINE、Email）</button>' : ''}
      <div class="row" style="margin-top:12px"><button onclick="openOrder(XLS.back)">返回這張單</button></div>`);
  } catch (e) { toast(e.net ? '沒有網路，Excel 要有網路才能做' : 'Excel 產生失敗：' + e.message); }
}
let XLS = null;
async function shareXls() {
  try { await navigator.share({ files: [XLS.file], title: XLS.file.name }); }
  catch (e) { if (e.name !== 'AbortError') toast('分享失敗，請改用「下載 Excel」'); }
}

/* ---------------- 抄貨紀錄：依日期 → 客戶 ---------------- */
let OFILTER = 'mine';
function openOrders() {
  const list = ORDERS.filter(o => !o.del && (OFILTER === 'all' || o.sales === WHO.name));
  const days = [...new Set(list.map(o => o.date))].sort().reverse();
  const pend = ORDERS.filter(o => o.dirty).length;
  openSheet(`<h2><span>抄貨紀錄</span><button class="ghost" onclick="closeSheet()">關閉</button></h2>
    <div class="chips" style="margin-bottom:6px">
      <button class="${OFILTER === 'mine' ? 'on' : ''}" onclick="OFILTER='mine';openOrders()">我抄的</button>
      <button class="${OFILTER === 'all' ? 'on' : ''}" onclick="OFILTER='all';openOrders()">全部業務</button>
      <button onclick="refreshOrders()">↻ 跟雲端對一次</button>
    </div>
    <div class="code">${pend ? `⏳ ${pend} 張還在手機，有網路會自動上傳` : '✓ 手機上的都已上傳'}｜手機保留近 60 天</div>
    ${days.map(d => {
      const os = list.filter(o => o.date === d).sort((a, b) => a.cust.n.localeCompare(b.cust.n));
      const dt = os.reduce((m, o) => m + totals(o).total, 0);
      return `<div class="day">${dayTxt(d)}　${os.length} 個客戶　${money(dt)}</div>` + os.map(o => {
        const s = totals(o), cur = CUST && o.cust.k === CUST.k && o.date === DAY && o.sales === WHO.name && coOf(o) === CO;
        return `<div class="ord ${cur ? 'cur' : ''}" onclick="openOrder('${o.id}')">
          <div style="display:flex;gap:8px;align-items:center"><b style="flex:1">${esc(o.cust.n)}</b><span>${money(s.total)}</span></div>
          <div class="code" style="display:flex;gap:6px;align-items:center"><span style="flex:1">${MULTI() ? esc(coName(o.co)) + '｜' : ''}${o.items.length} 項｜數量 ${numTxt(s.qty)}${OFILTER === 'all' ? '｜' + esc(o.sales) : ''}${o.no ? '｜' + esc(o.no) : ''}</span>
            <span class="badge ${o.dirty ? 'wait' : 'ok'}">${o.dirty ? '待上傳' : '已上傳'}</span>${o.fin ? '' : '<span class="badge wait">未按完成</span>'}</div></div>`;
      }).join('');
    }).join('') || '<div class="center">還沒有抄貨單</div>'}`);
}
async function refreshOrders() {
  toast('同步中…');
  await syncNow();
  try { await pullOrders(); toast('已跟雲端對過'); } catch (e) { toast(e.net ? '沒有網路' : e.message); }
  openOrders();
}

function openSheet(html) { document.getElementById('panel').innerHTML = html; document.getElementById('sheet').classList.remove('hide'); document.getElementById('panel').scrollTop = 0; }
function closeSheet() { stopCam(); document.getElementById('sheet').classList.add('hide'); render(); updateCart(); }
